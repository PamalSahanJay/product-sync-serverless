Resources:
  kafkaVPC:
      Type: AWS::EC2::VPC
      Properties:
        CidrBlock: 10.0.0.0/16
        Tags:
          - Key: Name
            Value: kafka-poc-vpc-pj

  kafkaSubnet1: 
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref kafkaVPC
      CidrBlock: 10.0.0.0/24 
      AvailabilityZone: us-east-1a
      Tags:
        - Key: Name
          Value: kafka-poc-subnet-jp

  kafkaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH access via port 22
      VpcId: !Ref kafkaVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: kafka-poc-sg-jp